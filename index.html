<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Vua AI - Assassin Mode</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text: #f8fafc;
            --subtext: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 490px;
            max-width: 95vw;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 20px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 14px;
            width: 100%;
        }

        .select-box, .toggle-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--subtext);
            cursor: pointer;
            user-select: none;
        }

        .toggle-box input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .toggle-box span {
            color: var(--text);
            font-weight: 600;
        }

        select {
            background: transparent;
            color: var(--text);
            border: none;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        select option {
            background: var(--panel-bg);
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
        }

        .btn-ai { background: var(--accent); }
        .btn-ai:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-reset { background: var(--danger); }
        .btn-reset:hover { background: var(--danger-hover); transform: translateY(-1px); }

        .btn-undo { background: #475569; }
        .btn-undo:hover { background: #64748b; }

        #myBoard {
            width: 420px;
            max-width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid var(--border);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            margin-bottom: 16px;
        }

        .status-bar {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: var(--text);
            box-sizing: border-box;
        }

        .highlight-move {
            box-shadow: inset 0 0 3px 3px rgba(16, 185, 129, 0.8);
        }
    </style>
</head>
<body>

<div class="app-card">
    <h2>Bàn Cờ AI Sát Thủ (Tấn Công Nhanh)</h2>

    <div class="toolbar">
        <div class="select-box">
            <span>Phe của bạn:</span>
            <select id="orientationSelect" onchange="changeOrientation()">
                <option value="white">Trắng (Dưới)</option>
                <option value="black">Đen (Dưới)</option>
            </select>
        </div>

        <label class="toggle-box">
            <input type="checkbox" id="autoReplyToggle" checked>
            <span>AI Tự Động Đáp Trả</span>
        </label>
    </div>

    <div class="toolbar">
        <button class="btn-ai" onclick="triggerAIMove()">AI Đi Ngay</button>
        <button class="btn-undo" onclick="undoMove()">Đi Lại</button>
        <button class="btn-reset" onclick="resetGame()">Làm Mới</button>
    </div>

    <div id="myBoard"></div>
    <div class="status-bar" id="status">Đang nạp bộ não tấn công Stockfish...</div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

<script>
    var board = null;
    var game = new Chess();
    var stockfish = null;
    var isThinking = false;
    var moveHistoryUCI = []; // Lưu chuỗi nước đi chuẩn UCI để AI nhớ toàn bộ chiến thuật

    async function initStockfish() {
        try {
            const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
            const scriptText = await response.text();
            const blob = new Blob([scriptText], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);

            stockfish = new Worker(workerUrl);
            stockfish.postMessage('uci');
            
            // TỐI ƯU HÓA TRÍ THÔNG MINH & LỐI ĐÁNH SÁT THỦ:
            stockfish.postMessage('setoption name Skill Level value 20'); // Max sức mạnh
            stockfish.postMessage('setoption name Hash value 64');        // Cấp 64MB RAM nhớ biến hóa giúp tính sâu hơn trong 0.5s
            stockfish.postMessage('setoption name Contempt value 100');    // Ép AI đánh tấn công khô máu, tuyệt đối không cầu hòa
            stockfish.postMessage('ucinewgame');

            stockfish.onmessage = function(event) {
                var message = event.data;
                if (message.startsWith('bestmove')) {
                    var moveStr = message.split(' ')[1];
                    executeBestMove(moveStr);
                }
            };
            updateStatus('Sẵn sàng! Chế độ tấn công chớp nhoáng đã bật.');
        } catch (error) {
            updateStatus('Lỗi mạng: Không tải được Stockfish. Hãy kiểm tra Wi-Fi!');
        }
    }

    function highlightSquares(source, target) {
        $('#myBoard .square-55d63').removeClass('highlight-move');
        $('#myBoard .square-' + source).addClass('highlight-move');
        $('#myBoard .square-' + target).addClass('highlight-move');
    }

    function onDragStart(source, piece) {
        if (game.game_over() || isThinking) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
            return false;
        }
    }

    function onDrop(source, target) {
        var move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';
        
        // Ghi lại nước đi vào lịch sử chiến thuật
        var uciMove = source + target + (move.promotion ? move.promotion : '');
        moveHistoryUCI.push(uciMove);

        highlightSquares(source, target);
        updateStatus();

        var aiSide = $('#orientationSelect').val() === 'white' ? 'w' : 'b';
        var isAutoEnabled = $('#autoReplyToggle').is(':checked');

        if (isAutoEnabled && game.turn() === aiSide && !game.game_over()) {
            window.setTimeout(triggerAIMove, 150);
        }
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function triggerAIMove() {
        if (!stockfish) {
            updateStatus('AI chưa tải xong, đợi xíu nhé!');
            return;
        }
        if (game.game_over()) {
            updateStatus('Ván đấu đã kết thúc!');
            return;
        }
        if (isThinking) return;

        isThinking = true;
        updateStatus('AI đang tìm đòn kết liễu...');

        // Gửi toàn bộ chuỗi nước đi từ đầu trận để Stockfish giữ nguyên kế hoạch tấn công và tận dụng bộ nhớ Hash
        if (moveHistoryUCI.length > 0) {
            stockfish.postMessage('position startpos moves ' + moveHistoryUCI.join(' '));
        } else {
            stockfish.postMessage('position startpos');
        }

        // Giữ nguyên tốc độ 500ms (0.5 giây) siêu mượt
        stockfish.postMessage('go movetime 500');
    }

    function executeBestMove(moveStr) {
        var source = moveStr.substring(0, 2);
        var target = moveStr.substring(2, 4);
        var promotion = moveStr.substring(4, 5);

        var move = game.move({
            from: source,
            to: target,
            promotion: promotion ? promotion : 'q'
        });

        if (move) {
            moveHistoryUCI.push(moveStr);
            board.position(game.fen());
            highlightSquares(source, target);
        }

        isThinking = false;
        updateStatus();
    }

    function changeOrientation() {
        var side = $('#orientationSelect').val();
        board.orientation(side);
        updateStatus('Đã đổi phe sang ' + (side === 'white' ? 'Trắng' : 'Đen') + '.');
    }

    function undoMove() {
        if (isThinking) return;
        game.undo();
        game.undo();
        moveHistoryUCI.pop();
        moveHistoryUCI.pop();
        board.position(game.fen());
        $('#myBoard .square-55d63').removeClass('highlight-move');
        updateStatus();
    }

    function resetGame() {
        if (isThinking) return;
        game.reset();
        moveHistoryUCI = [];
        board.start();
        if (stockfish) stockfish.postMessage('ucinewgame');
        $('#myBoard .square-55d63').removeClass('highlight-move');
        updateStatus('Đã làm mới bàn cờ!');
    }

    function updateStatus(customText) {
        if (customText) {
            $('#status').text(customText);
            return;
        }
        var turn = game.turn() === 'w' ? 'Trắng' : 'Đen';
        var text = 'Lượt hiện tại: Quân ' + turn;
        if (game.in_checkmate()) {
            text = 'CHIẾU HẾT! Quân ' + (game.turn() === 'w' ? 'Đen' : 'Trắng') + ' thắng.';
        } else if (game.in_draw()) {
            text = 'HÒA CỜ!';
        } else if (game.in_check()) {
            text += ' (Đang bị chiếu!)';
        }
        $('#status').text(text);
    }

    board = Chessboard('myBoard', {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    });

    initStockfish();
</script>

</body>
</html>
